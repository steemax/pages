<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980" role="img" aria-labelledby="title desc">
  <title id="title">Схема компонентов kubevirt-manager</title>
  <desc id="desc">Браузер общается с Go HTTP server, который через auth middleware работает с KubeVirt, Kubernetes API и Prometheus</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2l8 4-8 4z" fill="#4b647a"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0e1a25" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1800" height="980" fill="#f3f6f8"/>
  <text x="90" y="95" fill="#10202f" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="800">kubevirt-manager: тонкий слой между людьми и KubeVirt API</text>
  <text x="92" y="138" fill="#637284" font-family="Inter, Arial, sans-serif" font-size="24">Минимум собственной state, Kubernetes остаётся source of truth</text>

  <g filter="url(#shadow)">
    <rect x="90" y="245" width="300" height="190" rx="12" fill="#ffffff" stroke="#d3dee8"/>
    <text x="128" y="308" fill="#10202f" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">Browser UI</text>
    <text x="128" y="350" fill="#637284" font-family="Inter, Arial, sans-serif" font-size="22">HTML forms</text>
    <text x="128" y="382" fill="#637284" font-family="Inter, Arial, sans-serif" font-size="22">fetch polling</text>
    <text x="128" y="414" fill="#637284" font-family="Inter, Arial, sans-serif" font-size="22">WebSocket console</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="545" y="214" width="360" height="252" rx="14" fill="#10202f"/>
    <text x="594" y="286" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">Go HTTP server</text>
    <text x="594" y="332" fill="#c7d7e4" font-family="Inter, Arial, sans-serif" font-size="22">server-side HTML</text>
    <text x="594" y="364" fill="#c7d7e4" font-family="Inter, Arial, sans-serif" font-size="22">handlers + validation</text>
    <text x="594" y="396" fill="#c7d7e4" font-family="Inter, Arial, sans-serif" font-size="22">async op state</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="545" y="562" width="360" height="170" rx="12" fill="#ffffff" stroke="#d3dee8"/>
    <text x="594" y="623" fill="#10202f" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">Auth middleware</text>
    <text x="594" y="665" fill="#637284" font-family="Inter, Arial, sans-serif" font-size="22">Keycloak OIDC</text>
    <text x="594" y="697" fill="#637284" font-family="Inter, Arial, sans-serif" font-size="22">session · app-группы · бюджеты</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1085" y="180" width="305" height="170" rx="12" fill="#ffffff" stroke="#d3dee8"/>
    <text x="1132" y="240" fill="#10202f" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">KubeVirt API</text>
    <text x="1132" y="282" fill="#637284" font-family="Inter, Arial, sans-serif" font-size="22">VM · VMI</text>
    <text x="1132" y="314" fill="#637284" font-family="Inter, Arial, sans-serif" font-size="22">start/stop/restart</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1085" y="405" width="305" height="190" rx="12" fill="#ffffff" stroke="#d3dee8"/>
    <text x="1132" y="466" fill="#10202f" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">Kubernetes API</text>
    <text x="1132" y="508" fill="#637284" font-family="Inter, Arial, sans-serif" font-size="22">Service · Secret</text>
    <text x="1132" y="540" fill="#637284" font-family="Inter, Arial, sans-serif" font-size="22">PVC · Pod logs</text>
    <text x="1132" y="572" fill="#637284" font-family="Inter, Arial, sans-serif" font-size="22">ConfigMap groups/budgets</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1085" y="650" width="305" height="150" rx="12" fill="#ffffff" stroke="#d3dee8"/>
    <text x="1132" y="710" fill="#10202f" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">Prometheus</text>
    <text x="1132" y="752" fill="#637284" font-family="Inter, Arial, sans-serif" font-size="22">CPU · RAM · network</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1490" y="360" width="220" height="230" rx="12" fill="#e9f7f5" stroke="#83c7bd"/>
    <text x="1530" y="428" fill="#0d4f4b" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">Cluster</text>
    <text x="1530" y="470" fill="#316962" font-family="Inter, Arial, sans-serif" font-size="21">source of truth</text>
    <text x="1530" y="510" fill="#316962" font-family="Inter, Arial, sans-serif" font-size="21">CRD + native</text>
    <text x="1530" y="542" fill="#316962" font-family="Inter, Arial, sans-serif" font-size="21">objects</text>
  </g>

  <g stroke="#4b647a" stroke-width="4" marker-end="url(#arrow)" fill="none">
    <path d="M390 340h132"/>
    <path d="M725 466v72"/>
    <path d="M905 285h150"/>
    <path d="M905 458h150"/>
    <path d="M905 666h150"/>
    <path d="M1390 500h72"/>
    <path d="M1390 265c80 0 82 95 98 158"/>
    <path d="M1390 725c80 0 82-95 98-158"/>
  </g>

  <g>
    <rect x="90" y="820" width="1620" height="74" rx="10" fill="#ffffff" stroke="#d3dee8"/>
    <text x="124" y="867" fill="#10202f" font-family="SFMono-Regular, Consolas, monospace" font-size="21">VM list = batch List + lookup maps; create/resize = access + budget gate; long operations = polling op-status</text>
  </g>
</svg>
